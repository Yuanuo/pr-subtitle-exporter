[package]
name = "pr-subtitle-exporter"
version = "0.1.0"
edition = "2021"
description = "从 Premiere Pro 工程文件批量导出序列字幕为 SRT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
] }
rfd = "0.14"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.20"
base64 = "0.22"

[profile.release]
opt-level = 2
strip = true
